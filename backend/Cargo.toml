[package]
name = "portfolio-backend"
version = "0.1.0"
edition = "2021"
description = "Axum server for Gursimar Gill's portfolio — serves the Vue SPA and a contact API."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP client for the Resend email API. Uses rustls + ring (no OpenSSL
# / aws-lc), which builds cleanly on both windows-gnu and Linux.
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
